polaris_hosts:
  hosts:
    swarm-manager:
      # database_admin can create databases and database_users
      database_admin:
        user: root
        port: 33301
        password: '{{ databaseAlpha_MariadbPrimaryRootPassword }}'
      databases:
        - name: mydb
      database_users:
        - name: dbdb
          password: '{{ databaseAlpha_DbdbPassword }}'
          privileges: '*.*:ALL,GRANT'
        - name: exporter
          password: '{{ databaseAlpha_ExporterPassword }}'
          privileges: '*.*:PROCESS,REPLICATION CLIENT,SLAVE MONITOR,SELECT'
          resource_limits:
            MAX_USER_CONNECTIONS: 3
      stacks:
        - name: database-alpha
          path: database-alpha
          host: swarm-manager
          tag: app
        - name: lb
          path: lb
          host: swarm-manager
          tag: lb
        - name: loki
          path: loki
          host: swarm-manager
          tag: logging
        - name: promtail
          path: promtail
          host: swarm-manager
          tag: logging
        - name: proxi
          path: proxi
          host: swarm-manager
          tag: app
        - name: whoami
          path: whoami
          host: swarm-manager
          tag: app
        - name: insight
          path: draco-insight
          host: swarm-manager
          tag: app
        - name: monitor
          path: monitor
          host: swarm-manager
          tag: app
    worker-1:
    worker-2:
      node_labels:
        com.linkorb.dev.a-labelled-node: 'true'

polaris_traefik_ingress_host:
  hosts:
    swarm-manager:

polaris_primary_swarm_managers:
  hosts:
    swarm-manager:

polaris_swarm_nodes:
  vars:
    join_swarm_initialised_by: swarm-manager
  hosts:
    worker-1:
    worker-2:
