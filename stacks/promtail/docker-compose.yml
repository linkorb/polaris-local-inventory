services:
  promtail:
    image: 'grafana/promtail:latest'
    command:
      - "-log-config-reverse-order"
      - "-config.file=/etc/promtail/config.yaml"
      - "-config.expand-env=true"
    volumes:
      - /run/log/journal/:/run/log/journal/:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - positions:/tmp/positions
    deploy:
      mode: global
      labels:
        - "orchestrator=polaris-stackmanager"
        - "traefik.enable=true"
        - "traefik.docker.network=traefik"
        - "traefik.http.routers.promtail-api.rule=Host(`promtail.local`)"
        - "traefik.http.routers.promtail-api.service=promtail-api"
        - "traefik.http.routers.promtail-api.entrypoints=websecure"
        - "traefik.http.routers.promtail-api.tls.domains.main=promtail.local"
        - "traefik.http.services.promtail-api.loadbalancer.server.port=9080"
    environment:
      HOSTNAME: "{{ .Node.Hostname }}"
    networks:
      - traefik
    configs:
      - source: config
        target: /etc/promtail/config.yaml
        mode: 0440

  prometheus:
    image: prom/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --log.level=debug
      - --agent
      - --enable-feature=expand-external-labels
    deploy:
      mode: global
      labels:
        - 'orchestrator=polaris-stackmanager'
    environment:
      HOSTNAME: '{{ .Node.Hostname }}'
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - 'prometheus_wal:/prometheus'
    networks:
      - traefik

configs:
  config:
    file: config.yaml
    name: promtail_config_25022501
  prometheus:
    file: prometheus.yml
    name: promtail_prometheus_25042401

networks:
  traefik:
    external: true

volumes:
  positions:
  prometheus_wal:
