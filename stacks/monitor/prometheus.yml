global:
  scrape_interval:     59s
  evaluation_interval: 60s
  scrape_timeout: 45s
  external_labels:
    constellation: local
    host: '${HOSTNAME}'
    stack: monitor

remote_write:
  - url: http://insight_prometheus:9090/api/v1/write
    write_relabel_configs:
      - source_labels: [service, host]
        separator: "."
        target_label: instance
      - source_labels: [instance]
        regex: "\\.?(.+)"
        replacement: "$1"
        target_label: instance

alerting:
  alertmanagers:

rule_files:

scrape_configs:
  # Make Prometheus scrape itself for metrics.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: monitor-prometheus
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: go_.+
        action: drop

  - job_name: docker-engine
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          service: docker-engine

  - job_name: nodes
    static_configs:
      - targets: ['host.docker.internal:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: go_.+
        action: drop
