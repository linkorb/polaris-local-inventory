apiVersion: 1

datasources:

  # https://grafana.com/docs/grafana/latest/datasources/alertmanager/#provision-the-alertmanager-data-source
  - name: Alertmanager
    type: alertmanager
    url: http://alertmanager:9093
    access: proxy
    jsonData:
      implementation: prometheus
      # Whether or not Grafana should send alert instances to this Alertmanager
      handleGrafanaManagedAlerts: false

  # https://grafana.com/docs/grafana/latest/datasources/prometheus/#provision-the-data-source
  - name: Prometheus
    type: prometheus
    isDefault: true
    access: proxy
    # Access mode - proxy (server in the UI) or direct (browser in the UI).
    url: http://insight_prometheus:9090
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.44.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
